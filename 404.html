<style>

  .box { max-width: 460px; }
  .selo { width: 64px; height: 64px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 16px; background: #16224a; color: #e9a23b; font: 700 2.2rem Georgia, serif; }

  p { color: var(--muted); margin: 0 0 24px; }
  a { display: inline-block; background: var(--brand); color: #fff; padding: 12px 22px; border-radius: 12px; text-decoration: none; font-weight: 600; }
</style>
</head>
