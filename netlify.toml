# Publica o repositório inteiro: plataforma na raiz, simulador em /simulador.
[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/plataforma-direito/"
  status = 301

[[redirects]]
  from = "/simulador/*"
  to = "/aposentadoria-app/:splat"
  status = 200

[functions]
  directory = "netlify/functions"

# Arquivos internos (anotações, banco, revisão, testes) não ficam acessíveis no site.
[[redirects]]
  from = "/plataforma-direito/CONTINUAR.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/plataforma-direito/supabase.sql"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/plataforma-direito/conteudo/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/plataforma-direito/ferramentas/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/plataforma-direito/escritorio/dac/testes/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

# Proteções básicas do navegador em todas as páginas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
# Painel e área do cliente: nunca indexar nem enviar o endereço (com o link pessoal) para outros sites.
[[headers]]
  for = "/plataforma-direito/escritorio/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
[[headers]]
  for = "/plataforma-direito/minha-area/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
