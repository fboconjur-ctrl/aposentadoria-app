<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Minha área — Plataforma do Direito</title>
<meta name="theme-color" content="#16224a">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--bg); }
  .ma { max-width: 880px; margin: 0 auto; padding: 20px 16px 80px; display: grid; gap: 16px; }
  .ma-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ma h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 4px 0; letter-spacing: -.02em; }
  .cartao { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 12px; align-content: start; }
  .cartao h2 { margin: 0; font-size: 1.1rem; display: flex; gap: 8px; align-items: center; }
  .recado { border-left: 4px solid var(--amber); background: var(--amber-soft, #fff6e5); }
  .linha-tempo { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; }
  .linha-tempo div { text-align: center; font-size: .78rem; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
  .linha-tempo i { width: 100%; height: 8px; border-radius: 99px; background: var(--line); display: block; }
  .linha-tempo .feito i { background: var(--brand); } .linha-tempo .atual i { background: var(--amber); }
  .linha-tempo .atual { color: var(--ink); font-weight: 700; }
  .lista { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .lista li { display: flex; gap: 12px; align-items: flex-start; }
  .lista .data { min-width: 86px; font-weight: 600; font-size: .9rem; }
  .muted { color: var(--muted); } .small { font-size: .88rem; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .78rem; font-weight: 600; background: var(--tint); }
  .pill.ok { background: #e3f5ea; color: #157f3b; } .pill.atraso { background: #fde8e8; color: #b42318; }
  .proc { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
  .proc .num { font-family: ui-monospace, monospace; font-weight: 700; }
  textarea, input[type=file] { font: inherit; }
  textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface); color: var(--ink); }
  .acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .grade { grid-template-columns: 1fr; } .linha-tempo div span { font-size: .68rem; } }
  .vazio { color: var(--muted); font-size: .92rem; }
  .erro { text-align: center; padding: 60px 16px; }
  .barra { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; } .barra i { display: block; height: 100%; background: var(--ok, #157f3b); }
  .passos { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
  .glossario { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; } .glossario dt { font-weight: 700; } .glossario dd { margin: 0; color: var(--muted); }
  @media (max-width: 560px) { .glossario { grid-template-columns: 1fr; } .glossario dd { margin-bottom: 8px; } }
  .duvida { border-top: 1px solid var(--line); padding: 10px 0; } .duvida summary { cursor: pointer; font-weight: 600; } .duvida p { margin: 8px 0 0; color: var(--muted); }
  .so-tela { margin-top: 8px; }
  @media print { .acoes, textarea, .btn, .btn-wa, .so-tela, details.duvida { display: none !important; } body { background: #fff; } .cartao { box-shadow: none; break-inside: avoid; } }
  .heroi { background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 10%, var(--surface)), color-mix(in srgb, var(--amber) 14%, var(--surface))); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: grid; gap: 14px; }
  .status { display: flex; gap: 16px; align-items: center; }
  .anel { --p: 50; flex: none; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--brand) calc(var(--p) * 1%), var(--line) 0); position: relative; }
  .anel::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--surface); }
  .anel b { position: relative; font-size: 1.05rem; }
  .grande { font-size: 1.25rem; }
  .resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .resumo > div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .alerta { border-left: 4px solid var(--brand); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; } .chip { background: var(--tint); border-radius: 99px; padding: 8px 14px; font-weight: 600; text-decoration: none; color: var(--ink); font-size: .92rem; }
  .atalhos { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; background: var(--bg); scrollbar-width: none; }
  .atalhos::-webkit-scrollbar { display: none; }
  .atalhos a { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: .88rem; font-weight: 600; color: var(--ink); text-decoration: none; }
  section.cartao { scroll-margin-top: 60px; }
  .trilha { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .trilha li { display: flex; gap: 12px; align-items: flex-start; color: var(--muted); }
  .trilha .bola { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); font-weight: 700; font-size: .85rem; background: var(--surface); }
  .trilha .feito .bola { background: var(--brand); border-color: var(--brand); color: #fff; }
  .trilha .atual { color: var(--ink); font-weight: 600; } .trilha .atual .bola { border-color: var(--amber); background: var(--amber-soft, #fff6e5); }
  .fases { display: flex; flex-wrap: wrap; gap: 4px; } .fases span { font-size: .75rem; padding: 3px 8px; border-radius: 99px; background: var(--line); color: var(--muted); }
  .fases .feito { background: color-mix(in srgb, var(--brand) 18%, var(--surface)); color: var(--ink); } .fases .atual { background: var(--brand); color: #fff; font-weight: 700; }
  .destaque { background: var(--tint); border-radius: 12px; padding: 12px; }
  .docs { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; } .docs summary { cursor: pointer; } .docs p { margin: 6px 0 0 22px; }
  .totais { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .totais div { background: var(--tint); border-radius: 12px; padding: 10px; }
  .chat { display: grid; gap: 8px; max-height: 380px; overflow-y: auto; padding: 4px; }
  .msg { max-width: 82%; padding: 10px 12px; border-radius: 14px; display: grid; gap: 4px; } .msg small { font-size: .72rem; color: var(--muted); }
  .msg.minha { justify-self: end; background: color-mix(in srgb, var(--brand) 12%, var(--surface)); border-bottom-right-radius: 4px; }
  .msg.dela { justify-self: start; background: var(--tint); border-bottom-left-radius: 4px; }
  .recibos { display: grid; gap: 8px; } .recibo { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; } .recibo.geral { border-color: var(--ok, #157f3b); background: #e3f5ea; }
  .rt-aviso { background: var(--amber-soft, #fff6e5); border-left: 4px solid var(--amber); border-radius: 10px; padding: 10px 12px; }
  .linkbtn { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; font: inherit; }
  @media (max-width: 720px) { .resumo { grid-template-columns: 1fr; } .heroi { padding: 16px; } }
  @media print { .atalhos, .chips, .chat { display: none !important; } details { display: block; } }
</style>
</head>
<body>
<main class="ma" id="ma">
  <div class="ma-topo"><a class="brand" href="../">Plataforma do Direito</a><span class="small muted" id="ma-atual"></span></div>
  <p class="muted" id="ma-carregando">Carregando sua área…</p>
</main>
<script src="../supabase-config.js"></script>
<script>
(() => {
  const CFG = window.SUPABASE_CONFIG, WA = "5561999733111";
  const token = (location.hash || "").slice(1).replace(/[^a-f0-9]/gi, "");
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const br = (d) => d ? String(d).slice(0, 10).split("-").reverse().join("/") : "";
  const reais = (v) => (+v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const hoje = new Date().toISOString().slice(0, 10);
  const rpc = (fn, body) => fetch(`${CFG.url}/rest/v1/rpc/${fn}`, { method: "POST", headers: { apikey: CFG.anonKey, Authorization: `Bearer ${CFG.anonKey}`, "Content-Type": "application/json" }, body: JSON.stringify(body) });

  function erro(msg) { $("ma").innerHTML = `<div class="cartao erro"><h1>Não foi possível abrir</h1><p class="muted">${msg}</p><p><a class="btn" href="https://wa.me/${WA}" target="_blank" rel="noopener">Falar no WhatsApp</a></p></div>`; }

  function entrada() {
    const msg = encodeURIComponent("Olá! Sou cliente do escritório e perdi o link da minha área do cliente. Meu nome completo é: ");
    $("ma").innerHTML = `<div class="ma-topo"><a class="brand" href="../">Plataforma do Direito</a></div>
      <section class="heroi"><p class="eyebrow">Área do cliente</p><h1>Acompanhe o seu caso</h1>
        <p class="muted" style="margin:0">Cada cliente tem um <b>link pessoal</b> para acompanhar o caso: etapa, próximos passos, processo explicado, documentos, agenda, pagamentos, recibos e conversa com a advogada.</p></section>
      <section class="cartao"><h2>🔑 Como entrar</h2>
        <ol class="passos"><li>Procure a mensagem da advogada no <b>WhatsApp</b> ou no seu <b>e-mail</b> com o link da sua área (começa com <span class="small">plataformadodireito.com.br/plataforma-direito/minha-area/#…</span>).</li><li>Toque no link. Ele abre direto, sem senha.</li><li>Dica: depois de abrir, salve nos favoritos do navegador ou na tela inicial do celular para entrar mais rápido.</li></ol></section>
      <section class="cartao"><h2>❓ Perdeu o link?</h2>
        <p style="margin:0">Peça pelo WhatsApp. Por segurança, a advogada confirma quem é você antes de reenviar.</p>
        <div class="acoes"><a class="btn btn-wa" href="https://wa.me/${WA}?text=${msg}" target="_blank" rel="noopener">Pedir meu link pelo WhatsApp</a></div></section>
      <section class="cartao"><h2>Ainda não é cliente?</h2><p style="margin:0">Conte o seu caso na página inicial e veja o que a lei diz sobre a sua situação.</p><div class="acoes"><a class="btn" href="../">Ir para a página inicial</a></div></section>
      <p class="small muted">🔒 O link é pessoal: não compartilhe. Quem tem o link vê as informações do caso.</p>`;
  }
  async function carregar() {
    if (!token) return entrada();
    if (token.length < 32) return erro("Este link está incompleto. Use o link completo que a advogada enviou pelo WhatsApp ou por e-mail.");
    let d; try { const r = await rpc("portal_ver", { p_token: token }); d = await r.json(); } catch { return erro("Sem conexão no momento. Tente de novo em instantes."); }
    if (!d) return erro("Este link não está mais ativo. Peça um novo à advogada.");
    render(d);
  }

  // ---------- Conteúdo explicativo (informativo, sem prometer resultado) ----------
  const DOC_INFO = [
    [/cnis/i, "Mostra todo o seu histórico de trabalho e contribuições ao INSS. É a base para calcular tempo e valor.", "No app ou site Meu INSS: entre com a conta gov.br → “Extrato de contribuição (CNIS)” → baixar PDF."],
    [/carteira.*trabalho|ctps/i, "Comprova vínculos e datas que às vezes faltam no CNIS.", "Fotografe todas as páginas com contratos e anotações. A Carteira Digital também ajuda (app Carteira de Trabalho Digital)."],
    [/indeferimento|concess[ãa]o/i, "Mostra o que o INSS decidiu e por quê — é o ponto de partida do recurso ou da ação.", "No Meu INSS → “Consultar pedidos” → abra o pedido e baixe a carta/decisão."],
    [/ppp|ltcat/i, "Comprova trabalho com agentes nocivos (ruído, químicos, etc.), que pode contar como tempo especial.", "Peça ao RH da empresa (é um direito seu). Se a empresa fechou, avise a advogada."],
    [/laudo|exame|relat[óo]rio m[ée]dico/i, "Mostra a doença ou a necessidade do tratamento. Quanto mais detalhado e recente, melhor.", "Peça ao médico um relatório com CID, histórico, tratamento indicado e, se houver, a urgência."],
    [/contrato|nota fiscal|fatura/i, "Prova a relação com a empresa e o que foi combinado ou cobrado.", "Procure no e-mail, no app da empresa ou peça a 2ª via no atendimento."],
    [/protocolo|reclama/i, "Mostra que você tentou resolver antes, o que fortalece o pedido.", "Anote o número dos protocolos de SAC; prints do Procon ou do consumidor.gov.br servem."],
    [/print|conversa|e-?mail|an[úu]ncio/i, "Registra o que foi dito ou prometido.", "Faça prints mostrando data, hora e o nome/número de quem enviou."],
    [/comprovante.*pagamento/i, "Prova o que você pagou.", "Extrato do banco, comprovante do Pix ou boleto pago."],
    [/plano de sa[úu]de|carteirinha/i, "Mostra o plano e a cobertura contratada.", "Foto da carteirinha (frente e verso) e o contrato ou o manual do plano."],
    [/negativa/i, "É a prova de que o pedido foi recusado.", "Peça a negativa por escrito (o plano é obrigado a fornecer) ou anote o protocolo da ligação."],
    [/rg|cnh|cpf|resid[êe]ncia/i, "Identificam você e confirmam onde mora (define qual juízo é competente).", "Foto nítida de frente e verso; comprovante de residência dos últimos 3 meses (luz, água, internet)."],
    [/contracheque|fgts/i, "Mostram salário, descontos e depósitos.", "No app/portal do empregador; extrato do FGTS no app FGTS."],
    [/rescis|trct/i, "Mostra o que foi pago na saída.", "Documento entregue pela empresa na demissão."],
    [/certid/i, "Comprovam nascimento, casamento ou óbito.", "Cartório de registro civil ou o site Registro Civil (registrocivil.org.br)."],
    [/matr[íi]cula/i, "Mostra quem é dono do imóvel e se há ônus.", "Cartório de Registro de Imóveis (pode ser pedida online)."],
    [/ato|portaria|decis|edital|processo administrativo|ficha funcional/i, "Mostra exatamente o que o órgão decidiu e com base em quê.", "Pelo sistema do órgão, pelo Diário Oficial ou pedindo cópia ao setor responsável."],
  ];
  const infoDoc = (n) => DOC_INFO.find(([re]) => re.test(n));
  const FASES = [["Início", /distribu|peti[çc][ãa]o inicial|autua/i], ["Citação/defesa", /cita|contesta|defesa|manifesta/i], ["Provas", /audi[êe]ncia|per[íi]cia|laudo|testemunh|instru/i], ["Decisão", /senten|julg/i], ["Recurso", /recurso|apela|agravo|ac[óo]rd|turma|c[âa]mara/i], ["Cumprimento", /cumprimento|rpv|precat|alvar|pagamento|execu/i]];
  const faseDe = (evs) => { let f = 0; for (const e of [...evs].reverse()) FASES.forEach(([, re], i) => { if (re.test(e.titulo + " " + (e.explicacao || ""))) f = Math.max(f, i); }); return f; };
  const DEPOIS = [[/cita/i, "A outra parte agora tem um prazo para apresentar a defesa."], [/contesta/i, "A advogada vai analisar a defesa e responder, se for o caso."], [/audi[êe]ncia/i, "Confira a data na Agenda. A advogada avisa se você precisa participar."], [/per[íi]cia/i, "Você será avisado(a) da data e de como se preparar."], [/senten/i, "A advogada vai analisar a decisão e conversar com você sobre os próximos passos, inclusive recurso."], [/recurso|apela/i, "O recurso será analisado por um tribunal. Esta fase costuma levar alguns meses."], [/ac[óo]rd/i, "A advogada vai analisar a decisão do tribunal e explicar o que muda."], [/rpv|precat|alvar/i, "É a fase de pagamento. A advogada acompanha a liberação do valor."], [/intima|despacho/i, "Em geral é um andamento do processo; se precisar de algo seu, avisamos aqui."]];
  const depois = (e) => (DEPOIS.find(([re]) => re.test(e.titulo + " " + (e.explicacao || ""))) || [, ""])[1];
  const PREPARO = [[/audi[êe]ncia/i, ["Chegue (ou entre na sala virtual) 15 minutos antes.", "Leve documento com foto.", "Fale a verdade, com calma; se não souber, diga que não sabe.", "Combine antes com a advogada o que será tratado."]], [/per[íi]cia/i, ["Leve documento com foto e todos os laudos, exames e receitas.", "Explique ao perito o que sente no dia a dia, sem exagerar nem minimizar.", "Leve a lista de remédios que usa."]], [/consulta|reuni/i, ["Separe os documentos que você tem sobre o caso.", "Anote suas dúvidas para não esquecer."]]];
  const preparo = (t) => (PREPARO.find(([re]) => re.test(t)) || [, null])[1];
  const gcal = (a) => { const d = a.quando.replace(/-/g, ""), h = (a.hora || "").replace(":", ""); const ini = h ? `${d}T${h}00` : d, fim = h ? `${d}T${String(Math.min(23, +h.slice(0, 2) + 1)).padStart(2, "0")}${h.slice(2)}00` : d; return "https://calendar.google.com/calendar/render?" + new URLSearchParams({ action: "TEMPLATE", text: a.texto, dates: `${ini}/${fim}`, location: a.local || "" }); };
  const AVISO = "Mesmo com os documentos enviados e o contrato assinado, o caso só começa a andar depois da conversa com a advogada, que é agendada após o pagamento da entrada ou da consulta.";
  const dias = (iso) => Math.round((new Date(iso + "T12:00:00") - new Date(hoje + "T12:00:00")) / 864e5);
  const quandoTxt = (iso) => { const n = dias(iso); return n === 0 ? "hoje" : n === 1 ? "amanhã" : n > 1 ? `em ${n} dias` : `há ${-n} dia(s)`; };

  function render(d) {
    const n = d.etapas?.length || 6, idx = d.etapaIdx || 0;
    const pags = d.pagamentos || [], atraso = pags.filter((p) => !p.pago && p.venc < hoje), aPagar = pags.filter((p) => !p.pago), pago = pags.filter((p) => p.pago);
    const docsPend = (d.docsStatus || []).length ? d.docsStatus.filter((x) => !x.ok).map((x) => x.doc) : (d.precisamos || []);
    const prox = (d.agenda || [])[0];
    const evs = (d.processos || []).flatMap((p) => p.eventos || []).sort((a, b) => b.data.localeCompare(a.data));
    const ultima = evs[0] || (d.feitos || [])[0] && { data: d.feitos[0].data, titulo: d.feitos[0].texto };
    let visto = ""; try { visto = localStorage.getItem("ma-visto-" + token.slice(0, 8)) || ""; localStorage.setItem("ma-visto-" + token.slice(0, 8), new Date().toISOString()); } catch {}
    const novas = (d.conversa || []).filter((m) => m.de === "advogada" && String(m.em) > visto).length;
    const pend = [...(docsPend.length ? [[`📋 ${docsPend.length} documento(s) para enviar`, "#docs"]] : []), ...(d.proposta && !d.proposta.aceita ? [["📄 Proposta de honorários para ver", "#proposta"]] : []), ...((d.assinar || []).filter((a) => !a.assinado).length ? [[`✍️ ${(d.assinar || []).filter((a) => !a.assinado).length} documento(s) para assinar`, "#assinar"]] : []), ...(atraso.length ? [[`💳 ${atraso.length} pagamento(s) em atraso`, "#pagamentos"]] : []), ...(prox && dias(prox.quando) <= 7 ? [[`📅 ${prox.texto} ${quandoTxt(prox.quando)}`, "#agenda"]] : []), ...(novas && visto ? [[`💬 ${novas} resposta(s) nova(s) da advogada`, "#conversa"]] : [])];
    const sec = (id, ico, tit, corpo, extra = "") => `<section class="cartao" id="${id}"><h2>${ico} ${tit}${extra}</h2>${corpo}</section>`;

    $("ma").innerHTML = `
      <div class="ma-topo"><a class="brand" href="../">Plataforma do Direito</a><span class="small muted">Atualizado em ${new Date(d.atualizado || Date.now()).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })}</span></div>
      <section class="heroi">
        <p class="eyebrow">Minha área</p>
        <h1>Olá, ${esc(d.nome)}.</h1>
        <p class="muted" style="margin:0">${esc([d.area, d.assunto].filter(Boolean).join(" · "))}${d.advogada ? ` · com ${esc(d.advogada)}` : ""}</p>
        <div class="status">
          <div class="anel" style="--p:${Math.round(100 * (idx + (idx === n - 1 ? 1 : 0.5)) / n)}"><b>${idx + 1}/${n}</b></div>
          <div><span class="small muted">Etapa atual</span><br><b class="grande">${esc(d.etapa)}</b><br><span class="small">${esc(d.proximo || "")}</span></div>
        </div>
        <div class="resumo">
          <div><span class="small muted">Última novidade</span><br><b>${ultima ? `${esc(ultima.titulo)}` : "—"}</b>${ultima ? `<br><span class="small muted">${br(ultima.data)}</span>` : ""}</div>
          <div><span class="small muted">Próximo compromisso</span><br><b>${prox ? esc(prox.texto) : "Nenhum marcado"}</b>${prox ? `<br><span class="small muted">${br(prox.quando)}${prox.hora ? " às " + esc(prox.hora) : ""} · ${quandoTxt(prox.quando)}</span>` : ""}</div>
          <div><span class="small muted">Precisa de você?</span><br><b>${pend.length ? "Sim — veja abaixo" : "Nada agora 👍"}</b></div>
        </div>
      </section>
      ${pend.length ? `<section class="cartao alerta"><h2>👉 O que precisa de você</h2><div class="chips">${pend.map(([t, h]) => `<a class="chip" href="${h}">${esc(t)}</a>`).join("")}</div></section>` : ""}
      ${d.recado ? `<section class="cartao recado"><h2>📌 Recado da advogada</h2><p style="margin:0;white-space:pre-line">${esc(d.recado)}</p></section>` : ""}
      <nav class="atalhos">${[...((d.assinar || []).some((a) => !a.assinado) ? [["#assinar", "Assinar"]] : []), ["#caminho", "Etapas"], ["#processo", "Processo"], ["#docs", "Documentos"], ["#agenda", "Agenda"], ["#pagamentos", "Pagamentos"], ["#conversa", "Conversa"], ["#entenda", "Entenda"]].map(([h, t]) => `<a href="${h}">${t}</a>`).join("")}</nav>

      ${sec("caminho", "🧭", "O caminho do seu caso", `
        ${idx <= 3 ? `<p class="rt-aviso small" style="margin:0">⚠️ ${AVISO}</p>` : ""}
        <ol class="trilha">${(d.etapas || []).map((t, i) => `<li class="${i < idx ? "feito" : i === idx ? "atual" : ""}"><span class="bola">${i < idx ? "✓" : i + 1}</span><span>${esc(t)}${i === idx ? `<br><span class="small">${esc(d.proximo || "")}</span>` : ""}</span></li>`).join("")}</ol>
        ${(d.feitos || []).length ? `<details><summary class="small"><b>Tudo o que já foi feito (${d.feitos.length})</b></summary><ul class="lista small" style="margin-top:8px">${d.feitos.map((f) => `<li><span class="data">${br(f.data)}</span><span>${esc(f.texto)}</span></li>`).join("")}</ul></details>` : ""}`)}

      ${sec("processo", "⚖️", (d.processos || []).length > 1 ? "Seus processos" : "Seu processo", (d.processos || []).length ? d.processos.map((p) => { const f = faseDe(p.eventos || []), ult = (p.eventos || [])[0]; return `<div class="proc">
          <div><span class="num">${esc(p.numero)}</span> ${p.tribunal ? `<span class="pill">${esc(p.tribunal)}</span>` : ""}<br><span class="small muted">${esc([p.classe, p.orgao].filter(Boolean).join(" · "))}</span></div>
          <div class="fases">${FASES.map(([t], i) => `<span class="${i < f ? "feito" : i === f ? "atual" : ""}">${t}</span>`).join("")}</div>
          ${ult ? `<div class="destaque"><span class="small muted">Último andamento · ${br(ult.data)}</span><br><b>${esc(ult.titulo)}</b>${ult.explicacao ? `<br>O que significa: ${esc(ult.explicacao)}.` : ""}${depois(ult) ? `<br><span class="small"><b>E agora?</b> ${esc(depois(ult))}</span>` : ""}<br><span class="small muted">Você não precisa fazer nada, a menos que a advogada avise.</span></div>` : `<p class="vazio">Ainda sem movimentações registradas.</p>`}
          ${(p.eventos || []).length > 1 ? `<details><summary class="small"><b>Histórico completo (${p.eventos.length})</b></summary><ul class="lista" style="margin-top:8px">${p.eventos.map((e) => `<li><span class="data">${br(e.data)}</span><span><b>${esc(e.titulo)}</b>${e.explicacao ? `<br><span class="small">${esc(e.explicacao)}.</span>` : ""}</span></li>`).join("")}</ul></details>` : ""}
        </div>`; }).join("") + `<p class="small muted" style="margin:0">As fases são uma visão simplificada. Nem todo processo passa por todas, e a ordem pode mudar.</p>` : `<p class="vazio">Ainda não há processo judicial. Quando houver, as novidades aparecem aqui, explicadas em palavras simples.</p>`)}

      ${d.proposta ? sec("proposta", "📄", "Proposta de honorários", `
        <div class="recibo${d.proposta.aceita ? " geral" : ""}"><span><b>Proposta nº ${esc(d.proposta.num)}</b><br><span class="small muted">${d.proposta.aceita ? `✅ Você aceitou em ${new Date(d.proposta.aceita).toLocaleDateString("pt-BR")}` : `Válida até ${br(d.proposta.validade)}`}</span></span><button class="btn" id="ma-prop-ver">Ver proposta</button></div>
        ${d.proposta.aceita ? `<p class="small" style="margin:0">Próximo passo: o contrato e a procuração para assinar pelo gov.br.</p><p class="rt-aviso small" style="margin:0">⚠️ ${AVISO}</p>` : `<p class="small" style="margin:0">Leia com calma. Se tiver dúvida, pergunte na conversa abaixo. Quando estiver de acordo, toque em aceitar.</p>
        <label class="small"><input type="checkbox" id="ma-prop-ok"> Li a proposta e estou de acordo.</label>
        <div class="acoes"><button class="btn" id="ma-prop-aceitar">✅ Aceito a proposta</button><span class="small" id="ma-prop-st"></span></div>`}`) : ""}
      ${(d.assinar || []).length ? sec("assinar", "✍️", "Documentos para você assinar", `
        <p class="small" style="margin:0">A assinatura é feita pelo <b>gov.br</b>, de graça e com validade jurídica (assinatura eletrônica avançada, Lei 14.063/2020). Você precisa de conta gov.br nível <b>prata ou ouro</b>.</p>
        ${d.assinar.map((a) => `<div class="recibo${a.assinado ? " geral" : ""}"><span><b>${esc(a.nome)}</b><br><span class="small muted">${a.assinado ? "✅ Recebemos assinado. Obrigada!" : "Aguardando sua assinatura"}</span></span>${a.assinado ? "" : `<a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener" download>1. Baixar</a>`}</div>`).join("")}
        <details open><summary class="small"><b>Como assinar (passo a passo)</b></summary><ol class="passos small">
          <li>Toque em <b>“1. Baixar”</b> e salve o PDF no celular ou computador.</li>
          <li>Abra o assinador do gov.br: <a href="https://assinador.iti.br" target="_blank" rel="noopener">assinador.iti.br</a> e entre com sua conta gov.br.</li>
          <li>Escolha o arquivo baixado, posicione a assinatura e toque em <b>Assinar</b>. O gov.br envia um código por SMS ou pelo app.</li>
          <li>Baixe o arquivo <b>assinado</b> (o gov.br gera um PDF novo).</li>
          <li>Volte aqui e envie em <b>Documentos → Enviar documentos</b>. Pronto: a advogada recebe na hora.</li>
        </ol><p class="small muted">Não tem conta prata ou ouro? No app gov.br, use o reconhecimento facial ou entre pelo seu banco para subir o nível. Se tiver dificuldade, fale com a gente.</p></details>
        <a class="btn btn-wa" href="https://assinador.iti.br" target="_blank" rel="noopener">2. Abrir o assinador gov.br</a>`) : ""}
      ${sec("docs", "📋", "Documentos", `
        ${(d.docsStatus || []).length ? `<p class="small muted" style="margin:0">${d.docsStatus.filter((x) => x.ok).length} de ${d.docsStatus.length} recebidos</p><div class="barra"><i style="width:${Math.round(100 * d.docsStatus.filter((x) => x.ok).length / d.docsStatus.length)}%"></i></div>` : ""}
        ${docsPend.length ? `<ul class="docs">${docsPend.map((x) => { const i = infoDoc(x); return `<li><details><summary>☐ <b>${esc(x)}</b></summary>${i ? `<p class="small"><b>Para que serve:</b> ${esc(i[1])}</p><p class="small"><b>Como conseguir:</b> ${esc(i[2])}</p>` : `<p class="small">Se tiver dúvida sobre este documento, pergunte na conversa abaixo.</p>`}</details></li>`; }).join("")}</ul>` : `<p class="vazio">Nenhum documento pendente no momento. 👍</p>`}
        ${(d.docsStatus || []).some((x) => x.ok) ? `<p class="small muted" style="margin:0">✅ Recebidos: ${d.docsStatus.filter((x) => x.ok).map((x) => esc(x.doc)).join(" · ")}</p>` : ""}
        ${(d.documentosRecebidos || []).length ? `<p class="small muted" style="margin:0">Arquivos já enviados: ${d.documentosRecebidos.map(esc).join(" · ")}</p>` : ""}
        ${(d.assinar || []).some((a) => !a.assinado) ? `<label class="small"><input type="checkbox" id="ma-assinado"> Estou enviando um documento que assinei no gov.br</label>` : ""}
        <div class="acoes"><label class="btn">📎 Enviar documentos<input type="file" id="ma-arq" multiple accept="application/pdf,image/*" hidden></label><span class="small muted" id="ma-arq-msg">PDF ou foto nítida, até 10 MB cada. Só o escritório tem acesso.</span></div>`)}

      <div class="grade">
        ${sec("agenda", "📅", "Agenda", (d.agenda || []).length ? `<ul class="lista">${d.agenda.map((a) => { const pr = preparo(a.texto); return `<li><span class="data">${br(a.quando)}${a.hora ? `<br><span class="small muted">${esc(a.hora)}</span>` : ""}</span><span><b>${esc(a.texto)}</b> <span class="pill">${quandoTxt(a.quando)}</span>${a.local ? `<br><span class="small muted">${esc(a.local)}</span>` : ""}
          ${pr ? `<details><summary class="small">Como se preparar</summary><ul class="small">${pr.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}<a class="small" href="${gcal(a)}" target="_blank" rel="noopener">+ adicionar à minha agenda</a></span></li>`; }).join("")}</ul>` : `<p class="vazio">Nenhum compromisso marcado. Quando houver audiência, perícia ou reunião, aparece aqui com orientações.</p>`)}
        ${sec("pagamentos", "💳", "Pagamentos", pags.length ? `<div class="totais"><div><span class="small muted">Pago</span><br><b>${reais(pago.reduce((s, p) => s + (+p.valor || 0), 0))}</b></div><div><span class="small muted">A pagar</span><br><b>${reais(aPagar.reduce((s, p) => s + (+p.valor || 0), 0))}</b></div></div>
          ${atraso.length ? `<p class="small" style="margin:0"><span class="pill atraso">${atraso.length} em atraso</span> Se já pagou, desconsidere. Se estiver com dificuldade, fale com a gente: dá para conversar.</p>` : ""}
          ${(d.recibos || []).length ? `<div class="recibos"><b class="small">🧾 Seus recibos</b>${d.recibos.map((r, i) => `<div class="recibo${r.geral ? " geral" : ""}"><span><b>${esc(r.titulo)}</b><br><span class="small muted">${esc(r.desc)}${r.valor != null ? ` · ${reais(r.valor)}` : ""}${r.data ? ` · ${br(r.data)}` : ""}</span></span><button class="btn" data-recibo="${i}">Ver / imprimir</button></div>`).join("")}</div>` : ""}
          <ul class="lista">${pags.map((p) => `<li><span class="data">${br(p.venc)}</span><span>${esc(p.desc)}${p.parcela ? ` (${esc(p.parcela)})` : ""}<br><b>${reais(p.valor)}</b> ${p.pago ? `<span class="pill ok">pago em ${br(p.pago)}</span>` : p.venc < hoje ? `<span class="pill atraso">em atraso</span>` : `<span class="pill">vence ${quandoTxt(p.venc)}</span>`}</span></li>`).join("")}</ul>` : `<p class="vazio">Nenhum pagamento lançado.</p>`)}
      </div>

      ${sec("conversa", "💬", "Conversa com a advogada", `
        <p class="small muted" style="margin:0">${esc(d.contato?.horario || "")}. ${esc(d.contato?.resposta || "")}</p>
        <div class="chat">${(d.conversa || []).length ? [...d.conversa].reverse().slice(-12).map((m) => `<div class="msg ${m.de === "advogada" ? "dela" : "minha"}"><span>${esc(m.texto)}</span><small>${m.de === "advogada" ? "Advogada" : "Você"} · ${new Date(m.em).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })}</small></div>`).join("") : `<p class="vazio">Ainda não há mensagens. Escreva sua dúvida abaixo.</p>`}</div>
        <textarea id="ma-msg" rows="3" maxlength="2000" placeholder="Escreva sua dúvida ou recado. A resposta aparece aqui."></textarea>
        <div class="acoes"><button class="btn" id="ma-enviar">Enviar mensagem</button><a class="btn btn-wa" href="https://wa.me/${WA}?text=${encodeURIComponent(`Olá! Sou ${d.nome} e queria falar sobre o meu caso.`)}" target="_blank" rel="noopener">WhatsApp</a><span class="small" id="ma-msg-st"></span></div>`, novas && visto ? ` <span class="pill">${novas} nova(s)</span>` : "")}

      ${sec("entenda", "📖", "Entenda o seu caso", `
        ${d.guia ? `<p style="margin:0"><b>${esc(d.guia.t)}</b></p><ol class="passos">${d.guia.passos.map((x) => `<li>${esc(x)}</li>`).join("")}</ol><p class="small muted" style="margin:0">⏱️ ${esc(d.guia.tempo)} Cada caso é único: a advogada explica o que vale para o seu.</p>` : ""}
        ${(d.glossario || []).length ? `<h3 class="small">Palavras que aparecem no seu processo</h3><dl class="glossario">${d.glossario.map(([t, e]) => `<dt>${esc(t)}</dt><dd>${esc(e)}</dd>`).join("")}</dl>` : ""}
        <h3 class="small">Seus direitos durante o atendimento</h3>
        <ul class="small"><li>Receber informações claras sobre o andamento e pedir cópia das peças e documentos do seu caso.</li><li>Ser avisado(a) com antecedência quando precisar comparecer ou enviar algo.</li><li>Ter seus dados protegidos e pedir a correção ou a exclusão quando o caso terminar (LGPD).</li><li>Fazer perguntas sempre que quiser — nenhuma dúvida é boba.</li></ul>
        ${(d.duvidas || []).length ? `<h3 class="small">Dúvidas comuns</h3>${d.duvidas.map(([q, a]) => `<details class="duvida"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}` : ""}`)}

      <p class="small muted so-tela"><button class="linkbtn" onclick="window.print()">🖨️ Imprimir ou salvar um resumo do meu caso</button></p>
      <p class="small muted">🔒 Este link é pessoal: não compartilhe. As informações são um resumo para acompanhamento; a orientação sobre o seu caso é sempre dada pela advogada.</p>`;
    if ($("ma-prop-ver")) $("ma-prop-ver").onclick = () => { const w = open(URL.createObjectURL(new Blob([d.proposta.html], { type: "text/html" })), "_blank"); if (!w) alert("Permita abrir janelas para ver a proposta."); };
    if ($("ma-prop-aceitar")) $("ma-prop-aceitar").onclick = async () => {
      if (!$("ma-prop-ok").checked) { $("ma-prop-st").textContent = "Marque a caixa confirmando que leu a proposta."; return; }
      $("ma-prop-aceitar").disabled = true;
      try { const r = await rpc("portal_enviar", { p_token: token, p_texto: `✅ Aceito a proposta nº ${d.proposta.num}. Li e estou de acordo com as condições.` }); const ok = await r.json(); $("ma-prop-st").textContent = ok ? "Recebido! A advogada vai te enviar o contrato e a procuração para assinar." : "Não foi possível registrar agora. Tente de novo."; }
      catch { $("ma-prop-st").textContent = "Sem conexão. Tente de novo."; $("ma-prop-aceitar").disabled = false; }
    };
    document.querySelectorAll("[data-recibo]").forEach((b) => (b.onclick = () => { const r = d.recibos[+b.dataset.recibo]; const w = open(URL.createObjectURL(new Blob([r.html], { type: "text/html" })), "_blank"); if (!w) alert("Permita abrir janelas para ver o recibo."); }));
    const chat = document.querySelector(".chat"); if (chat) chat.scrollTop = chat.scrollHeight;
    $("ma-enviar").onclick = async () => {
      const t = $("ma-msg").value.trim(); if (!t) return;
      $("ma-enviar").disabled = true;
      try { const r = await rpc("portal_enviar", { p_token: token, p_texto: t }); const ok = await r.json(); $("ma-msg-st").textContent = ok ? "Mensagem enviada! A advogada vai responder." : "Não foi possível enviar agora."; if (ok) $("ma-msg").value = ""; }
      catch { $("ma-msg-st").textContent = "Sem conexão. Tente de novo."; }
      $("ma-enviar").disabled = false;
    };
    $("ma-arq").onchange = async (e) => {
      const fs = [...e.target.files].slice(0, 8); let ok = 0;
      for (const [i, f] of fs.entries()) {
        if (f.size > 10 * 1024 * 1024) continue;
        $("ma-arq-msg").textContent = `Enviando ${i + 1} de ${fs.length}…`;
        const nome = `${Date.now()}-${document.getElementById("ma-assinado")?.checked ? "ASSINADO-" : ""}${f.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w.\-]+/g, "_").slice(-80)}`;
        try { const r = await fetch(`${CFG.url}/storage/v1/object/pedidos-docs/portal/${token}/${encodeURIComponent(nome)}`, { method: "POST", headers: { apikey: CFG.anonKey, Authorization: `Bearer ${CFG.anonKey}`, "Content-Type": f.type || "application/octet-stream" }, body: f }); if (r.ok) ok++; } catch {}
      }
      $("ma-arq-msg").textContent = ok ? `✅ ${ok} documento(s) enviado(s). A advogada já recebeu.` : "Não foi possível enviar. Tente de novo ou mande pelo WhatsApp.";
      e.target.value = "";
    };
  }
  carregar();
})();
</script>
</body>
</html>
